[workspace]
members = [
    "tinted-builder",
    "tinted-builder-rust",
]
default-members = ["tinted-builder-rust"]
resolver = "2"

[workspace.package]
rust-version = "1.88.0"

[workspace.dependencies]
dirs = "6.0.0"
regex = "1.12.2"
ribboncurls = "0.5.0"
semver = "1.0.27"
serde = "1.0.228"
serde_yaml = "0.9.34"
strip-ansi-escapes = "0.2.1"
